<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <div class="balance-display">
      <span class="balance-label">Total Expenses:</span>
      <span id="balance-total">$0.00</span>
    </div>
  </header>

  <main>

    <section id="input-section">
      <h2>Add Expense</h2>

      <div class="form-group">
        <label for="item-name">Item Name</label>
        <input
          type="text"
          id="item-name"
          maxlength="100"
          aria-describedby="item-name-error"
          autocomplete="off"
          placeholder="e.g. Lunch"
        >
        <span id="item-name-error" class="field-error" aria-live="polite" hidden></span>
      </div>

      <div class="form-group">
        <label for="item-amount">Amount ($)</label>
        <input
          type="number"
          id="item-amount"
          min="0.01"
          max="999999999.99"
          step="0.01"
          aria-describedby="item-amount-error"
          placeholder="0.00"
        >
        <span id="item-amount-error" class="field-error" aria-live="polite" hidden></span>
      </div>

      <div class="form-group">
        <label for="item-category">Category</label>
        <select id="item-category" aria-describedby="item-category-error">
          <option value="" disabled selected>Select a category</option>
        </select>
        <span id="item-category-error" class="field-error" aria-live="polite" hidden></span>
      </div>

      <button type="button" id="add-btn">Add Expense</button>

    </section>

    <section id="category-section">
      <h2>Manage Categories</h2>
      <!-- Category_Manager UI: custom category input, list, delete buttons -->
    </section>

    <section id="chart-section">
      <h2>Spending by Category</h2>
      <canvas id="expense-chart" aria-label="Spending distribution by category"></canvas>
      <div id="chart-legend"></div>
      <p id="chart-empty" hidden>No data to display</p>
    </section>

    <section id="summary-section">
      <h2>Monthly Summary</h2>
      <!-- Monthly_Summary: month filter input, clear button, totals -->
    </section>

    <section id="list-section">
      <h2>Transaction History</h2>
      <!-- Sort_Control + Transaction_List -->
      <ul id="transaction-list" aria-label="Transaction history">
        <!-- populated by renderTransactionList() -->
      </ul>
    </section>

  </main>

  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- App logic -->
  <script src="js/app.js"></script>

</body>
</html>
